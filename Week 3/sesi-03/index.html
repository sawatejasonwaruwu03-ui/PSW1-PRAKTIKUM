<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pendaftaran Kegiatan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Pendaftaran Kegiatan</h1>

        <figure>
            <img
                src="LogoSaya.jpeg"
                alt="Logo kegiatan"
                width="300"
                height="300"
            >
            <figcaption>Logo kegiatan.</figcaption>
        </figure>

        <p>Kolom bertanda wajib harus diisi.</p>

        <form action="#" method="get">

            <label for="nama">Nama lengkap (wajib)</label>
            <input
                id="nama"
                name="nama"
                type="text"
                autocomplete="name"
                required
            >

            <label for="email">Email (wajib)</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
            >

            <label for="telepon">Nomor Telepon</label>
            <input
                id="telepon"
                name="telepon"
                type="tel"
                autocomplete="tel"
            >

            
            <label for="kode">Kode peserta (6 angka, wajib)</label>

            <p id="kode-help">
                Contoh: 001234. Gunakan tepat enam angka.
            </p>

            <input
                id="kode"
                name="kode"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{6}"
                aria-describedby="kode-help"
                required
            >

            <label for="prodi">Program studi (wajib)</label>

            <select id="prodi" name="prodi" required>
                <option value="">Pilih program studi</option>
                <option value="trpl">D4 TRPL</option>
                <option value="ti">D3 Teknologi Informasi</option>
            </select>

            <fieldset>
                <legend>Mode kehadiran (wajib)</legend>

                <input
                    id="luring"
                    name="mode"
                    type="radio"
                    value="luring"
                    required
                >
                <label for="luring">Luring</label>

                <input
                    id="daring"
                    name="mode"
                    type="radio"
                    value="daring"
                >
                <label for="daring">Daring</label>
            </fieldset>

            <label for="tiket">Jumlah Tiket</label>

            <input
                id="tiket"
                name="tiket"
                type="number"
                min="1"
                max="5"
                step="1"
            >

            <fieldset>
                <legend>Topik yang diminati</legend>

                <input
                    id="pengembangan-situs-web-1"
                    name="topik"
                    type="checkbox"
                    value="Pengembangan Situs Web 1"
                >
                <label for="pengembangan-situs-web-1">
                    Pengembangan Situs Web 1
                </label>

                <input
                    id="dasar-pemrograman"
                    name="topik"
                    type="checkbox"
                    value="Dasar Pemrograman"
                >
                <label for="dasar-pemrograman">
                    Dasar Pemrograman
                </label>
            </fieldset>

            <label for="catatan">Catatan (opsional)</label>

            <textarea
                id="catatan"
                name="catatan"
                rows="4"
                maxlength="300"
            ></textarea>

            <button type="submit">Daftar</button>

        </form>

    </main>

</body>

</html>
